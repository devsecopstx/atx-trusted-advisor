apiVersion: apps/v1
kind: Deployment
metadata:
  name: atxfinance-frontend
  labels:
    app.kubernetes.io/name: atxfinance-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atxfinance-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atxfinance-frontend
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: atxfinance-frontend
      containers:
        - name: frontend
          # Replace PROJECT_ID, REGION, IMAGE_TAG after push to Artifact Registry.
          image: REGION-docker.pkg.dev/PROJECT_ID/atxfinance-core-app/atxfinance-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            # Mount remaining runtime keys via Secret Manager CSI / ExternalSecrets — see deploy/k8s/README.md
          envFrom:
            - configMapRef:
                name: atxfinance-frontend-runtime
                optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
