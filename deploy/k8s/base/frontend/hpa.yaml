apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atxfinance-frontend
  labels:
    app.kubernetes.io/name: atxfinance-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atxfinance-frontend
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
