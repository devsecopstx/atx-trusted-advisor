# GKE Ingress / HTTP(S) load balancer tuning — requires cloud.google.com BackendConfig CRD on cluster.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: atxfinance-frontend-bc
  labels:
    app.kubernetes.io/name: atxfinance-frontend
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 80
