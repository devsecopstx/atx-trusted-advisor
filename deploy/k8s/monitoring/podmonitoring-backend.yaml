# Requires GKE Managed Service for Prometheus (PodMonitoring CRD).
# Scrapes Spring Boot Actuator Prometheus registry.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: atxfinance-backend
  namespace: atxfinance-prod
  labels:
    app.kubernetes.io/name: atxfinance-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: atxfinance-backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
