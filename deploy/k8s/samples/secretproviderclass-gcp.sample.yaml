# SAMPLE ONLY — requires Secret Store CSI Driver + Workload Identity + secrets in GSM.
# Replace PROJECT_ID and secret resource names; align with scripts/ops/gcp-runtime-secrets.inc.sh.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: atxfinance-frontend-gcp-secrets
  namespace: atxfinance-prod
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/MONGODB_URI_B64/versions/latest"
        fileName: "MONGODB_URI_B64"
      - resourceName: "projects/PROJECT_ID/secrets/XAI_API_KEY/versions/latest"
        fileName: "XAI_API_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/AUTH_SECRET/versions/latest"
        fileName: "AUTH_SECRET"
