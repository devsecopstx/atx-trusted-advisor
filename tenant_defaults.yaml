# defaults.yaml  or  seed-defaults.yaml
# Purpose: Reasonable first-time defaults + minimal seed data
# Used by: admin CLI, deployment script, docker-entrypoint, or CI seed job

# xAI API base URL — fallback when XAI_BASE_URL env is unset (Spring and local tooling)
XAI_BASE_URL: "https://api.x.ai/v1"
# xAI Management API base URL — fallback when XAI_MANAGEMENT_BASE_URL env is unset
XAI_MANAGEMENT_BASE_URL: "https://management-api.x.ai/v1"

app:
  name: "atx-fintech-backend"
  environment: development         # can be overridden by ENV
  version: "1.0.0"

urls:
  frontend: "http://localhost:3000"
  api: "http://localhost:8000"
  docs: "http://localhost:8000/docs"

features:
  enable_signup: true
  enable_waitlist: false
  enable_dark_mode_by_default: true
  require_email_verification: true
  allow_oauth_login: true
  max_upload_mb: 25

security:
  min_password_length: 10
  require_special_char: true
  require_number: true
  session_timeout_minutes: 60
  refresh_token_lifetime_days: 30
  access_token_lifetime_minutes: 15
  enable_2fa_by_default: false

rate_limits:
  login_attempts_per_minute: 10
  api_requests_per_minute: 120
  invite_codes_per_user: 5

defaults:
  user:
    role: "user"                     # or "member"
    theme: "system"
    language: "en"
    timezone: "America/Chicago"      # ← good default for Austin, TX
    notifications:
      email: false
      push: false
      in_app: true
      slack: true

initial_seed:
  roles:
    - id: 1
      name: global_admin
      description: "Full system access"
      is_system: true

    - id: 2
      name: user
      description: "Standard registered user"
      is_system: true

  users:                             # usually only 1–2 seed users
    - email: atxbogart@gmail.com
      name: Admin User
      role: global_admin
      x_user_id: "atxbogart"
      is_active: true
      email_verified: true
      created_by: system

    - email: sperezintexas@gmail.com
      name: Admin User
      role: global_admin
      x_user_id: "sperezintexas"
      is_active: true
      email_verified: true
      created_by: system

  settings:                          # key-value store style (very common)
    - key: site_name
      value: "atx-fintech-advisor"
      type: string
      public: true
      description: "atxFinTech Advisor"

    - key: support_email
      value: sperezintexas@gmail.com
      type: string
      public: true

    - key: max_projects_per_user
      value: "15"
      type: integer
      public: false

    - key: mongodb_uri_b64
      value: ""                      # ← leave empty or use test key via Secret Manager
      type: string
      public: true
      sensitive: true

    - key: mongodb_db_name
      value: "atxfinancedb-devtest"
      type: string
      public: true
      sensitive: false

    - key: xai_team_id
      value: ""
      type: string
      public: true
      sensitive: false

    - key: xai_api_key
      value: ""
      type: string
      public: true
      sensitive: true

    - key: xai_api_management_key
      value: ""
      type: string
      public: true
      sensitive: false
      
    - key: x_oauth_client_id
      value: ""
      type: string
      public: true
      sensitive: true
      
    - key: x_oauth_client_secret
      value: ""
      type: string
      public: true
      sensitive: true

    - key: admin_seed_email
      value: ""
      type: string
      public: true
      sensitive: false

    - key: admin_seed_usernames
      value: ""
      type: string
      public: true
      sensitive: false

    - key: admin_seed_default_broker
      value: "fidelity"
      type: string
      public: true
      sensitive: false

    - key: admin_seed_default_portfolio_ext_ref
      value: "my-default-acctId"
      type: string
      public: true
      sensitive: false

    - key: stripe_public_key
      value: ""
      type: string
      public: true
      sensitive: false                # hint for UI/admin panel

    - key: formspree_public_key
      value: ""
      type: string
      public: true
      sensitive: false

    - key: enable_beta_features
      value: "true"
      type: boolean
      public: false