# defaults.yaml  or  seed-defaults.yaml
# Purpose: Reasonable first-time defaults + documentation for optional Spring `optional:file:` config.
# Next.js `npm run seed:admin` loads this file when present: **`.env` wins** for any key that is set there; yaml fills gaps
# (e.g. `initial_seed.settings.admin_seed_email`, `xai_team_id`, `app.environment` + `site_name` for instance collection root).
# Keep sensitive keys under `initial_seed.settings` empty in Git; real secrets belong in `.env` / GCP Secret Manager (see .env.example).

# xAI API base URL — fallback when XAI_BASE_URL env is unset (Spring and local tooling)
XAI_BASE_URL: "https://api.x.ai/v1"
# xAI Management API base URL — fallback when XAI_MANAGEMENT_BASE_URL env is unset
XAI_MANAGEMENT_BASE_URL: "https://management-api.x.ai/v1"

app:
  name: "atx-fintech-backend"
  environment: prod        # can be overridden by ENV
  version: "1.0.0"
  # Instance xAI namespace (seed): `atx-<tier>-<site_slug>` from ATX_DEPLOY_TARGET / app.environment / settings.atx_deploy_target
  # plus ATX_INSTANCE_SITE_SLUG / settings.site_name. Drives display names: team KB `{root}-rag`, strategy root files `{root}-xoption-<env>`
  # (NODE_ENV development|test → dev; else this `environment`, default stage), xChat history `{root}-chat-<userId>`.
  # Repo RAG upload uses `atx-trusted-advisor-<dev|stage|prod>` + segments (`xpersonas`, `example-prompts`, `options-strategy`, …) — see `atx-rag-collection/README.md`.
  # Set ATX_INSTANCE_COLLECTION_ROOT in .env to override the derived prefix.
  # Use the prefix only — not xAI `collection_*` ids (personas still store those for API calls) and not the `*-rag` display name.

urls:
  frontend: "http://localhost:3000"
  api: "http://localhost:8000"
  docs: "http://localhost:8000/docs"

features:
  enable_signup: true
  enable_waitlist: false
  enable_dark_mode_by_default: true
  require_email_verification: true
  allow_oauth_login: true
  max_upload_mb: 25

security:
  min_password_length: 10
  require_special_char: true
  require_number: true
  session_timeout_minutes: 60
  refresh_token_lifetime_days: 30
  access_token_lifetime_minutes: 15
  enable_2fa_by_default: false

rate_limits:
  login_attempts_per_minute: 10
  api_requests_per_minute: 120
  invite_codes_per_user: 5

defaults:
  user:
    role: "user"                     # or "member"
    theme: "system"
    language: "en"
    timezone: "America/Chicago"      # ← good default for Austin, TX
    notifications:
      email: false
      push: false
      in_app: true
      slack: true

initial_seed:
  roles:
    - id: 1
      name: admin
      description: "Full system access"
      is_system: true

    - id: 2
      name: user
      description: "Standard registered user"
      is_system: true

  users:                             # illustrative only — not loaded by `scripts/seed-admin-user.mjs` (use ADMIN_SEED_EMAIL in .env)
    - email: atxbogart@gmail.com
      name: Admin User
      password_hash: ""              # ← your script should hash a default or env-provided password
      role: admin
      is_active: true
      email_verified: true
      created_by: system

  settings:                          # key-value store style (very common)
    - key: site_name
      value: "atx-trusted-advisor"
      type: string
      public: true
      description: "ATX-Trusted-Advisor"

    - key: support_email
      value: sperezintexas@gmail.com
      type: string
      public: true

    - key: max_projects_per_user
      value: "15"
      type: integer
      public: false

    - key: mongodb_uri_b64
      value: ""                      # ← leave empty or use test key via Secret Manager
      type: string
      public: true
      sensitive: true

    - key: mongodb_db_name
      value: "atxfinance"
      type: string
      public: true
      sensitive: false

    # Illustrative: Cloud Run may set ATX_DEPLOY_TARGET (stage | deploy | prod) for RAG/tenant defaults; Mongo DB name comes from MONGODB_URI path (not from this key).
    - key: atx_deploy_target
      value: "prod"
      type: string
      public: true
      sensitive: false

    - key: xai_api_key
      value: ""
      type: string
      public: true
      sensitive: true

    - key: xai_api_management_key
      value: ""
      type: string
      public: true
      sensitive: true

    - key: xai_team_id
      value: ""
      type: string
      public: true
      sensitive: true
      
    - key: x_oauth_client_id
      value: ""
      type: string
      public: true
      sensitive: true
      
    - key: x_oauth_client_secret
      value: ""
      type: string
      public: true
      sensitive: true

    - key: admin_seed_email
      value: "atxbogart@gmail.com"
      type: string
      public: true
      sensitive: false

    - key: admin_seed_usernames
      value: "atxbogart"
      type: string
      public: true
      sensitive: false

    - key: admin_seed_default_broker
      value: "fidelity"
      type: string
      public: true
      sensitive: false

    - key: admin_seed_default_portfolio_ext_ref
      value: "myfidelity-acctId"
      type: string
      public: true
      sensitive: false

    - key: stripe_public_key
      value: ""                      # ← leave empty or supply via Secret Manager
      type: string
      public: true
      sensitive: true                # hint for UI/admin panel
    - key: formspree_public_key
      value: "https://formspree.io/f/mnjgkkow"
      type: string
      public: true
      sensitive: true

    - key: enable_beta_features
      value: "false"
      type: boolean
      public: false
