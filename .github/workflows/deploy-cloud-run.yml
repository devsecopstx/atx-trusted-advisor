# Cloud Run deploy — manual trigger only.
#
# IMPORTANT (as of now):
#   Deploys are being done from the command line using local .env files.
#   GitHub-based deploys are temporarily blocked by the guard job below.
#
# To re-enable: remove or comment out the `guard-github-deploys-paused` job.
name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch or ref to deploy"
        required: true
        default: "main"
        type: string
      target:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      confirm_manual_approval:
        description: "Must be yes to proceed (manual gate)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      deployment_notes:
        description: "Optional notes included in Slack deploy message"
        required: false
        type: string
      image_ref:
        description:
          "Optional immutable image reference (…@sha256:…) to promote without
          rebuilding"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: "atxfinance-core-app"
  ARTIFACT_REGISTRY_REPOSITORY: "atxfinance-core-app"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_REPOSITORY: ${{ github.repository }}
  GH_REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  # Temporary safety guard while deploys are being done from the command line
  # using local .env.prod / .env.stage files (no GitHub deploys for now).
  guard-github-deploys-paused:
    name: GitHub deploys temporarily disabled (CLI + local .env only)
    runs-on: ubuntu-latest
    steps:
      - name: Fail — GitHub deploys paused
        run: |
          echo "::error::GitHub-based Cloud Run deploys are currently disabled."
          echo ""
          echo "Current process: Deploying from the command line with local .env files."
          echo ""
          echo "Use:"
          echo "  npm run ops:deploy:cloud-run:production"
          echo "  npm run ops:deploy:cloud-run:staging"
          echo ""
          echo "See AGENTS.md section 'Prod/stage Next deploy (no GitHub required)'."
          exit 1
  guard-manual-confirm:
    if: inputs.confirm_manual_approval != 'yes'
    name: Block unconfirmed deploy
    needs: [guard-github-deploys-paused]
    runs-on: ubuntu-latest
    steps:
      - name: Fail — confirmation required
        run: |
          echo "::error::Select confirm_manual_approval=yes to run deploy."
          exit 1

  verify:
    if: inputs.confirm_manual_approval == 'yes'
    name: Verify (lint, typecheck, tests, Next build)
    needs: [guard-github-deploys-paused]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Lint, typecheck, Next cache, build
        uses: ./.github/actions/node-verify
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tests (Vitest)
        env:
          ATXFINANCE_BACKEND_ORIGIN: ""
        run: npm run test

  deploy:
    if: inputs.confirm_manual_approval == 'yes'
    name: Deploy (${{ inputs.target }})
    needs: [verify, guard-github-deploys-paused]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.target }}
      cancel-in-progress: ${{ inputs.target == 'staging' }}
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && vars.PROD_BASE_URL ||
        vars.STAGING_BASE_URL }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve target context
        id: ctx
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = "production" ]; then
            echo "project_id=${{ vars.GCP_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "service_name=${{ vars.CLOUD_RUN_SERVICE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "base_url=${{ vars.PROD_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "deploy_target=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.GCP_PROJECT_ID_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "service_name=${{ vars.CLOUD_RUN_SERVICE_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "base_url=${{ vars.STAGING_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "deploy_target=stage" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact_project_id=${{ vars.GCP_ARTIFACT_PROJECT_ID || '' }}" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=${{ vars.ARTIFACT_REGISTRY_REPOSITORY || env.ARTIFACT_REGISTRY_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy configuration
        env:
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ steps.ctx.outputs.project_id }}
          SERVICE_NAME: ${{ steps.ctx.outputs.service_name }}
          BASE_URL: ${{ steps.ctx.outputs.base_url }}
          ATXFINANCE_BACKEND_ORIGIN: ${{ vars.ATXFINANCE_BACKEND_ORIGIN }}
          ARTIFACT_PROJECT_ID: ${{ steps.ctx.outputs.artifact_project_id }}
          ARTIFACT_REPOSITORY: ${{ steps.ctx.outputs.artifact_repository }}
          EXPECTED_GITHUB_REPOSITORY: ${{ vars.EXPECTED_GITHUB_REPOSITORY }}
          EXPECTED_GITHUB_OWNER: ${{ vars.EXPECTED_GITHUB_OWNER }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          for key in CLOUD_RUN_REGION PROJECT_ID SERVICE_NAME BASE_URL ATXFINANCE_BACKEND_ORIGIN GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required deploy config: ${key}"
              exit 1
            fi
          done
          if [[ "${ATXFINANCE_BACKEND_ORIGIN}" != https://* ]]; then
            echo "::error::ATXFINANCE_BACKEND_ORIGIN must use https:// for staging/production deploys (got ${ATXFINANCE_BACKEND_ORIGIN})"
            exit 1
          fi
          if [[ "${ATXFINANCE_BACKEND_ORIGIN}" =~ :8080([/]|$) ]]; then
            echo "::error::ATXFINANCE_BACKEND_ORIGIN must not include :8080 on public hosts (got ${ATXFINANCE_BACKEND_ORIGIN})"
            exit 1
          fi
          norm() { printf '%s' "$1" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]'; }
          if [ "$(norm "${ATXFINANCE_BACKEND_ORIGIN}")" = "$(norm "${BASE_URL}")" ]; then
            echo "::error::ATXFINANCE_BACKEND_ORIGIN must be the Spring backend Cloud Run URL, not the Next app BASE_URL (${BASE_URL}). Two services → two origins."
            exit 1
          fi
          if [ -z "${ARTIFACT_PROJECT_ID:-}" ]; then
            echo "ARTIFACT_PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_PROJECT_ID=${ARTIFACT_PROJECT_ID}" >> "$GITHUB_ENV"
          fi
          if [ -z "${ARTIFACT_REPOSITORY:-}" ]; then
            echo "::error::Missing Artifact Registry repository name (vars.ARTIFACT_REGISTRY_REPOSITORY or env default)"
            exit 1
          fi
          echo "ARTIFACT_REPOSITORY=${ARTIFACT_REPOSITORY}" >> "$GITHUB_ENV"
          if [ -n "${EXPECTED_GITHUB_REPOSITORY:-}" ] && [ "${EXPECTED_GITHUB_REPOSITORY}" != "${GH_REPOSITORY}" ]; then
            echo "::error::Repo mismatch: expected ${EXPECTED_GITHUB_REPOSITORY}, got ${GH_REPOSITORY}"
            exit 1
          fi
          if [ -n "${EXPECTED_GITHUB_OWNER:-}" ] && [ "${EXPECTED_GITHUB_OWNER}" != "${GH_REPOSITORY_OWNER}" ]; then
            echo "::error::Owner mismatch: expected ${EXPECTED_GITHUB_OWNER}, got ${GH_REPOSITORY_OWNER}"
            exit 1
          fi
          echo "Deploy context: repo=${GH_REPOSITORY} owner=${GH_REPOSITORY_OWNER} target=${{ inputs.target }} branch=${{ inputs.branch }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.ctx.outputs.project_id }}

      - name: Ensure Artifact Registry repository exists
        if: ${{ inputs.image_ref == '' }}
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project "${ARTIFACT_PROJECT_ID}" \
            --location "${{ vars.CLOUD_RUN_REGION }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${ARTIFACT_REPOSITORY}" \
            --project "${ARTIFACT_PROJECT_ID}" \
            --location "${{ vars.CLOUD_RUN_REGION }}" \
            --repository-format docker \
            --description "atxfinance Cloud Run images"

      - name: Build image with Cloud Build and resolve immutable digest
        id: image
        env:
          PROVIDED_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -n "${PROVIDED_IMAGE_REF}" ]; then
            echo "image_ref=${PROVIDED_IMAGE_REF}" >> "$GITHUB_OUTPUT"
            echo "::notice::Using provided image_ref for promotion: ${PROVIDED_IMAGE_REF}"
            exit 0
          fi

          IMAGE_REPO="${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${IMAGE_REPO}:${GITHUB_SHA}"
          SUBMIT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUBMIT_OUTPUT="$(gcloud builds submit --project "${ARTIFACT_PROJECT_ID}" --tag "${IMAGE_TAG}" . --async 2>&1 || true)"
          BUILD_ID="$(printf '%s\n' "${SUBMIT_OUTPUT}" | awk 'match($0,/builds\/([a-f0-9-]+)/,m){print m[1]; exit}')"
          BUILD_LOG_URL="$(printf '%s\n' "${SUBMIT_OUTPUT}" | awk 'match($0,/https:\/\/console\.cloud\.google\.com\/cloud-build\/builds\/[a-f0-9-]+[^ ]*/,m){print m[0]; exit}')"
          if [ -z "${BUILD_ID}" ]; then
            echo "::warning::Cloud Build ID missing from submit output; resolving via recent builds lookup"
            for _ in $(seq 1 24); do
              BUILD_ID="$(gcloud builds list --project "${ARTIFACT_PROJECT_ID}" --filter="images:${IMAGE_TAG}" --sort-by=~createTime --limit=1 --format='value(id)' 2>/dev/null || true)"
              if [ -n "${BUILD_ID}" ]; then
                break
              fi
              sleep 5
            done
            if [ -n "${BUILD_ID}" ] && [ -z "${BUILD_LOG_URL}" ]; then
              BUILD_LOG_URL="$(gcloud builds describe "${BUILD_ID}" --project "${ARTIFACT_PROJECT_ID}" --format='value(logUrl)' 2>/dev/null || true)"
            fi
          fi
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::Failed to start Cloud Build for ${IMAGE_TAG}"
            exit 1
          fi
          echo "::notice::Cloud Build started: ${BUILD_ID}"
          if [ -n "${BUILD_LOG_URL}" ]; then
            echo "::notice::Cloud Build logs: ${BUILD_LOG_URL}"
          fi
          FINAL_STATUS=""
          for _ in $(seq 1 240); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project "${ARTIFACT_PROJECT_ID}" --format='value(status)')"
            case "${STATUS}" in
              SUCCESS)
                FINAL_STATUS="${STATUS}"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build ${BUILD_ID} failed with status ${STATUS}"
                gcloud builds describe "${BUILD_ID}" --project "${ARTIFACT_PROJECT_ID}" --format='yaml(status,statusDetail,logUrl)'
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done
          if [ "${FINAL_STATUS}" != "SUCCESS" ]; then
            echo "::error::Cloud Build ${BUILD_ID} did not reach SUCCESS within polling window"
            gcloud builds describe "${BUILD_ID}" --project "${ARTIFACT_PROJECT_ID}" --format='yaml(status,statusDetail,logUrl)'
            exit 1
          fi
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_TAG}" --project "${ARTIFACT_PROJECT_ID}" --format='value(image_summary.digest)')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Failed to resolve image digest for ${IMAGE_TAG}"
            exit 1
          fi
          IMAGE_REF="${IMAGE_REPO}@${DIGEST}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "::notice::Built deployable image: ${IMAGE_REF}"

      - name: Drop legacy ALLOW_ANY_X_USER_LOGIN secret binding (if present)
        run: |
          gcloud run services update "${{ steps.ctx.outputs.service_name }}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --remove-secrets=ALLOW_ANY_X_USER_LOGIN \
            --quiet || echo "::notice::No ALLOW_ANY_X_USER_LOGIN secret binding to remove (ok)"

      - name: Verify required Secret Manager secrets exist
        run: |
          set -euo pipefail
          PROJECT="${{ steps.ctx.outputs.project_id }}"
          REQUIRED=(MONGODB_URI_B64 XAI_API_KEY XAI_MANAGEMENT_API_KEY XAI_FINANCE_COLLECTION_ID X_OAUTH_CLIENT_ID X_OAUTH_CLIENT_SECRET AUTH_SECRET SLACK_WEBHOOK_URL ADMIN_SEED_EMAIL REDIS_URL NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_PUBLIC_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET)
          if [ "${{ inputs.target }}" = "staging" ]; then
            REQUIRED+=(GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET)
          fi
          for s in "${REQUIRED[@]}"; do
            errfile="$(mktemp)"
            if gcloud secrets describe "$s" --project="$PROJECT" --format='value(name)' >/dev/null 2>"$errfile"; then
              rm -f "$errfile"
              continue
            fi
            err="$(cat "$errfile")"
            rm -f "$errfile"
            if echo "$err" | grep -qE 'PERMISSION_DENIED|permission.*denied|403'; then
              echo "::error::Secret Manager IAM denied for '${s}' in ${PROJECT} (need secretmanager.secrets.get). Grant the GitHub deploy SA (secret GCP_SERVICE_ACCOUNT_EMAIL) roles/secretmanager.viewer or roles/secretmanager.admin on this project."
            else
              echo "::error::Missing or unreachable GCP secret '${s}' in project ${PROJECT}"
              echo "$err"
            fi
            exit 1
          done

      - name: Clear legacy ADMIN_SEED_EMAIL bindings (literal or old secret ref)
        run: |
          SVC="${{ steps.ctx.outputs.service_name }}"
          R="${{ vars.CLOUD_RUN_REGION }}"
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-secrets=ADMIN_SEED_EMAIL --quiet || true
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-env-vars=ADMIN_SEED_EMAIL --quiet || true

      - name: Deploy to Cloud Run
        env:
          ALLOW_ANY_X_USER_LOGIN: ${{ vars.ALLOW_ANY_X_USER_LOGIN || 'false' }}
          XAI_CHAT_MODEL: ${{ vars.XAI_CHAT_MODEL || 'grok-4-1-fast-reasoning' }}
          ATXFINANCE_BACKEND_ORIGIN: ${{ vars.ATXFINANCE_BACKEND_ORIGIN }}
          AUTH_CALLBACK_USE_SPRING: ${{ vars.AUTH_CALLBACK_USE_SPRING || 'false' }}
          STRIPE_PRICE_BASIC_MONTHLY: ${{ vars.STRIPE_PRICE_BASIC_MONTHLY || '' }}
          STRIPE_PRICE_PREMIUM_MONTHLY: ${{ vars.STRIPE_PRICE_PREMIUM_MONTHLY || '' }}
          STRIPE_PRICE_PREMIUM_PLUS_MONTHLY: ${{ vars.STRIPE_PRICE_PREMIUM_PLUS_MONTHLY || '' }}
          STRIPE_PRICE_PREMIUM_PLUS_YEARLY: ${{ vars.STRIPE_PRICE_PREMIUM_PLUS_YEARLY || '' }}
          RENTAL_AI_PRODUCT_ID: ${{ vars.RENTAL_AI_PRODUCT_ID || '' }}
          RENTAL_BASE_PRICE_ID: ${{ vars.RENTAL_BASE_PRICE_ID || '' }}
          ENABLE_RENTAL_AI_BILLING: ${{ vars.ENABLE_RENTAL_AI_BILLING || '' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || '' }}
        run: |
          set -euo pipefail
          PROJECT="${{ steps.ctx.outputs.project_id }}"
          SECRETS="MONGODB_URI=MONGODB_URI_B64:latest,XAI_API_KEY=XAI_API_KEY:latest,XAI_MANAGEMENT_API_KEY=XAI_MANAGEMENT_API_KEY:latest,XAI_FINANCE_COLLECTION_ID=XAI_FINANCE_COLLECTION_ID:latest,X_OAUTH_CLIENT_ID=X_OAUTH_CLIENT_ID:latest,X_OAUTH_CLIENT_SECRET=X_OAUTH_CLIENT_SECRET:latest,AUTH_SECRET=AUTH_SECRET:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,ADMIN_SEED_EMAIL=ADMIN_SEED_EMAIL:latest,REDIS_URL=REDIS_URL:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:latest,STRIPE_PUBLIC_KEY=STRIPE_PUBLIC_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest"
          if gcloud secrets describe REDIS_URL_CONTROL --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},REDIS_URL_CONTROL=REDIS_URL_CONTROL:latest"
            echo "::notice::Redis control-plane secret found — binding REDIS_URL_CONTROL"
          fi
          if gcloud secrets describe REDIS_URL_CACHE --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},REDIS_URL_CACHE=REDIS_URL_CACHE:latest"
            echo "::notice::Redis cache-plane secret found — binding REDIS_URL_CACHE"
          fi
          if gcloud secrets describe GOOGLE_CLIENT_ID --project="$PROJECT" --format='value(name)' >/dev/null 2>&1 && \
            gcloud secrets describe GOOGLE_CLIENT_SECRET --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
            echo "::notice::Google OAuth secrets found — binding to Cloud Run (Sign in with Google)"
          else
            echo "::notice::Google OAuth secrets not both present in ${PROJECT} — Sign in with Google unavailable until both GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET exist (staging deploy requires them)"
          fi
          if gcloud secrets describe XAI_TEAM_ID --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},XAI_TEAM_ID=XAI_TEAM_ID:latest"
            echo "::notice::XAI_TEAM_ID secret found — binding to Cloud Run"
          else
            echo "::notice::XAI_TEAM_ID secret absent — optional; sync: npm run ops:secrets:sync-xai-team-id:staging|:prod"
          fi
          if gcloud secrets describe SMTP_HOST --project="$PROJECT" --format='value(name)' >/dev/null 2>&1 && \
            gcloud secrets describe SMTP_PORT --project="$PROJECT" --format='value(name)' >/dev/null 2>&1 && \
            gcloud secrets describe SMTP_USER --project="$PROJECT" --format='value(name)' >/dev/null 2>&1 && \
            gcloud secrets describe SMTP_PASS --project="$PROJECT" --format='value(name)' >/dev/null 2>&1 && \
            gcloud secrets describe DESK_EMAIL_FROM --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,DESK_EMAIL_FROM=DESK_EMAIL_FROM:latest"
            echo "::notice::Desk SMTP secrets found — portfolio email delivery channels enabled"
          else
            echo "::notice::Desk SMTP secrets not all present in ${PROJECT} — portfolio email channels skipped (sync: scripts/ops/sync-desk-smtp-secrets-from-env.sh)"
          fi
          if gcloud secrets describe ATX_SCHEDULER_INTERNAL_SECRET --project="$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            SECRETS="${SECRETS},ATX_SCHEDULER_INTERNAL_SECRET=ATX_SCHEDULER_INTERNAL_SECRET:latest"
            echo "::notice::ATX_SCHEDULER_INTERNAL_SECRET found — binding to Next (scheduler execute-task delegate)"
          else
            echo "::notice::ATX_SCHEDULER_INTERNAL_SECRET absent — optional; sync: npm run ops:secrets:sync-scheduler-delegate:staging|:prod"
          fi
          ENV_VARS="NODE_ENV=production,HOSTNAME=0.0.0.0,ATX_DEPLOY_TARGET=${{ steps.ctx.outputs.deploy_target }},X_OAUTH_CALLBACK_URL=${{ steps.ctx.outputs.base_url }}/api/auth/x/callback,GOOGLE_OAUTH_CALLBACK_URL=${{ steps.ctx.outputs.base_url }}/api/auth/google/callback,NEXT_PUBLIC_APP_URL=${{ steps.ctx.outputs.base_url }},PUBLIC_APP_BASE_URL=${{ steps.ctx.outputs.base_url }},ALLOW_ANY_X_USER_LOGIN=${ALLOW_ANY_X_USER_LOGIN},XAI_CHAT_MODEL=${XAI_CHAT_MODEL},AUTH_CALLBACK_USE_SPRING=${AUTH_CALLBACK_USE_SPRING}"
          ENV_VARS="${ENV_VARS},ATXFINANCE_BACKEND_ORIGIN=${ATXFINANCE_BACKEND_ORIGIN}"
          for pair in "STRIPE_PRICE_BASIC_MONTHLY:${STRIPE_PRICE_BASIC_MONTHLY:-}" "STRIPE_PRICE_PREMIUM_MONTHLY:${STRIPE_PRICE_PREMIUM_MONTHLY:-}" "STRIPE_PRICE_PREMIUM_PLUS_MONTHLY:${STRIPE_PRICE_PREMIUM_PLUS_MONTHLY:-}" "STRIPE_PRICE_PREMIUM_PLUS_YEARLY:${STRIPE_PRICE_PREMIUM_PLUS_YEARLY:-}" "RENTAL_AI_PRODUCT_ID:${RENTAL_AI_PRODUCT_ID:-}" "RENTAL_BASE_PRICE_ID:${RENTAL_BASE_PRICE_ID:-}" "ENABLE_RENTAL_AI_BILLING:${ENABLE_RENTAL_AI_BILLING:-}" "SMTP_SECURE:${SMTP_SECURE:-}"; do
            k="${pair%%:*}"
            v="${pair#*:}"
            if [ -n "$v" ]; then ENV_VARS="${ENV_VARS},${k}=${v}"; fi
          done
          IMAGE_REF="${{ steps.image.outputs.image_ref }}"
          if [ -z "${IMAGE_REF}" ]; then
            echo "::error::Missing immutable image reference"
            exit 1
          fi
          SCALING_FLAGS=()
          if [ "${{ inputs.target }}" = "production" ]; then
            SCALING_FLAGS=(--min-instances=1 --max-instances=12)
          fi
          gcloud run deploy "${{ steps.ctx.outputs.service_name }}" \
            --image "${IMAGE_REF}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu-boost \
            --memory=1Gi \
            --startup-probe=initialDelaySeconds=30,tcpSocket.port=8080,timeoutSeconds=5,periodSeconds=10,failureThreshold=60 \
            "${SCALING_FLAGS[@]}" \
            --set-env-vars "${ENV_VARS}" \
            --set-secrets "${SECRETS}" \
            --quiet

      - name: Health check
        run: |
          bash scripts/ops/health-check-with-fallback.sh \
            "${{ inputs.target }}" \
            "${{ steps.ctx.outputs.base_url }}" \
            "${{ steps.ctx.outputs.service_name }}" \
            "${{ vars.CLOUD_RUN_REGION }}" \
            "18" \
            "15"

      - name: Post deploy note to Slack
        env:
          DEPLOYMENT_NOTES: ${{ inputs.deployment_notes || '' }}
        run: |
          set -euo pipefail
          PROJECT="${{ steps.ctx.outputs.project_id }}"
          WEBHOOK_URL="$(gcloud secrets versions access latest --secret=SLACK_WEBHOOK_URL --project="${PROJECT}" 2>/dev/null || true)"
          if [ -z "${WEBHOOK_URL}" ] || [ "${WEBHOOK_URL}" = "__EMPTY__" ]; then
            echo "::notice::SLACK_WEBHOOK_URL is empty/disabled in ${PROJECT}; skipping Slack notification."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOYMENT_NOTES_VALUE="${DEPLOYMENT_NOTES:-}"
          export RUN_URL
          export DEPLOYMENT_NOTES_VALUE
          export TARGET="${{ inputs.target }}"
          export BRANCH="${{ inputs.branch }}"
          export SERVICE_NAME="${{ steps.ctx.outputs.service_name }}"
          export BASE_URL="${{ steps.ctx.outputs.base_url }}"

          PAYLOAD="$(python3 -c 'import json,os; run_url=os.getenv("RUN_URL",""); notes=(os.getenv("DEPLOYMENT_NOTES_VALUE") or "").strip(); actor=os.getenv("GITHUB_ACTOR","unknown"); sha=(os.getenv("GITHUB_SHA","") or "")[:7]; target=os.getenv("TARGET",""); branch=os.getenv("BRANCH",""); service=os.getenv("SERVICE_NAME",""); base_url=os.getenv("BASE_URL",""); lines=[f"✅ Cloud Run deploy succeeded ({target})", f"• Service: {service}", f"• Branch: {branch} @ {sha}", f"• Actor: {actor}", f"• URL: {base_url}", f"• Run: {run_url}"]; lines += [f"• Notes: {notes}"] if notes else []; print(json.dumps({"text":"\\n".join(lines)}))')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${WEBHOOK_URL}" >/dev/null
