name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      approval:
        description: "Required for production deploys"
        required: true
        type: choice
        options:
          - no
          - approve-production
      deployment_notes:
        description: "Optional deployment notes for Slack post-deploy message"
        required: false
        type: string
      hotfix_notes:
        description: "Optional hotfix notes for Slack post-deploy message"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: "atxfinance-core-app"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_REPOSITORY: ${{ github.repository }}
  GH_REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  # Manual runs: production deploy only runs when approval == approve-production.
  # target=production + approval=no skips every job with no visible error — fail fast.
  validate-workflow-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.approval != 'approve-production'
    name: Block invalid production dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Explain required inputs
        run: |
          echo "::error::No deploy ran. For **target production** set **approval** to **approve-production**. **approval no** skips all deploy jobs. Re-run with approval **approve-production**."
          exit 1

  deploy-staging:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    name: Deploy Staging
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging deploy configuration
        env:
          GCP_PROJECT_ID_STAGING: ${{ vars.GCP_PROJECT_ID_STAGING }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE_STAGING: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_GITHUB_REPOSITORY: ${{ vars.EXPECTED_GITHUB_REPOSITORY }}
          EXPECTED_GITHUB_OWNER: ${{ vars.EXPECTED_GITHUB_OWNER }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

        run: |
          set -euo pipefail
          # Preflight (before build): repo vars + OIDC deploy identity only. App runtime secrets: GCP Secret Manager
          # single source of truth — verified with gcloud after auth (see "Verify required Secret Manager secrets").
          for key in GCP_PROJECT_ID_STAGING CLOUD_RUN_REGION CLOUD_RUN_SERVICE_STAGING STAGING_BASE_URL GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required deploy config: ${key}"
              exit 1
            fi
          done
          if [ -n "${EXPECTED_GITHUB_REPOSITORY:-}" ] && [ "${EXPECTED_GITHUB_REPOSITORY}" != "${GH_REPOSITORY}" ]; then
            echo "::error::Repo mismatch: expected ${EXPECTED_GITHUB_REPOSITORY}, got ${GH_REPOSITORY}"
            exit 1
          fi
          if [ -n "${EXPECTED_GITHUB_OWNER:-}" ] && [ "${EXPECTED_GITHUB_OWNER}" != "${GH_REPOSITORY_OWNER}" ]; then
            echo "::error::Owner mismatch: expected ${EXPECTED_GITHUB_OWNER}, got ${GH_REPOSITORY_OWNER}"
            exit 1
          fi
          echo "Deploy context: repo=${GH_REPOSITORY} owner=${GH_REPOSITORY_OWNER} target=staging"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI gate
        run: npm run ci:gate

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_STAGING }}

      # gcloud run deploy cannot combine --remove-secrets with --set-secrets; strip legacy binding first.
      - name: Drop legacy ALLOW_ANY_X_USER_LOGIN secret binding (if present)
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE_STAGING }}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --remove-secrets=ALLOW_ANY_X_USER_LOGIN \
            --quiet || echo "::notice::No ALLOW_ANY_X_USER_LOGIN secret binding to remove (ok)"

      - name: Verify required Secret Manager secrets exist (staging)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID_STAGING }}"
          for s in MONGODB_URI_B64 XAI_API_KEY XAI_MANAGEMENT_API_KEY X_OAUTH_CLIENT_ID X_OAUTH_CLIENT_SECRET AUTH_SECRET SLACK_WEBHOOK_URL ADMIN_SEED_EMAIL; do
            errfile="$(mktemp)"
            if gcloud secrets describe "$s" --project="$PROJECT" --format='value(name)' >/dev/null 2>"$errfile"; then
              rm -f "$errfile"
              continue
            fi
            err="$(cat "$errfile")"
            rm -f "$errfile"
            if echo "$err" | grep -qE 'PERMISSION_DENIED|permission.*denied|403'; then
              echo "::error::Secret Manager IAM denied for '${s}' in ${PROJECT} (need secretmanager.secrets.get). Grant the GitHub deploy SA (secret GCP_SERVICE_ACCOUNT_EMAIL) roles/secretmanager.viewer or roles/secretmanager.admin on this project — see DEVELOPMENT.md (GCP Secret Manager)."
            else
              echo "::error::Missing or unreachable GCP secret '${s}' in project ${PROJECT}"
              echo "$err"
            fi
            exit 1
          done

      - name: Clear legacy ADMIN_SEED_EMAIL bindings (literal or old secret ref)
        run: |
          SVC="${{ vars.CLOUD_RUN_SERVICE_STAGING }}"
          R="${{ vars.CLOUD_RUN_REGION }}"
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-secrets=ADMIN_SEED_EMAIL --quiet || true
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-env-vars=ADMIN_SEED_EMAIL --quiet || true

      - name: Deploy to Cloud Run (staging)
        env:
          ALLOW_ANY_X_USER_LOGIN: ${{ vars.ALLOW_ANY_X_USER_LOGIN || 'false' }}
          ENABLE_XCHAT_DEBUG: ${{ vars.ENABLE_XCHAT_DEBUG || 'false' }}
          XAI_CHAT_MODEL: ${{ vars.XAI_CHAT_MODEL || 'grok-4-1-fast-reasoning' }}
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE_STAGING }}" \
            --source . \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,X_OAUTH_CALLBACK_URL=${{ vars.STAGING_BASE_URL }}/api/auth/x/callback,ALLOW_ANY_X_USER_LOGIN=${ALLOW_ANY_X_USER_LOGIN},ENABLE_XCHAT_DEBUG=${ENABLE_XCHAT_DEBUG},XAI_CHAT_MODEL=${XAI_CHAT_MODEL}" \
            --set-secrets "MONGODB_URI_B64=MONGODB_URI_B64:latest,XAI_API_KEY=XAI_API_KEY:latest,XAI_MANAGEMENT_API_KEY=XAI_MANAGEMENT_API_KEY:latest,X_OAUTH_CLIENT_ID=X_OAUTH_CLIENT_ID:latest,X_OAUTH_CLIENT_SECRET=X_OAUTH_CLIENT_SECRET:latest,AUTH_SECRET=AUTH_SECRET:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,ADMIN_SEED_EMAIL=ADMIN_SEED_EMAIL:latest" \
            --quiet

      - name: Health check staging
        run: |
          bash scripts/ops/health-check-with-fallback.sh \
            "staging" \
            "${{ vars.STAGING_BASE_URL }}" \
            "${{ vars.CLOUD_RUN_SERVICE_STAGING }}" \
            "${{ vars.CLOUD_RUN_REGION }}" \
            "18" \
            "15"

  deploy-production-main:
    needs: [deploy-staging]
    if: false
    name: Deploy Production (Main Promotion)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production deploy configuration
        env:
          GCP_PROJECT_ID_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE_PROD: ${{ vars.CLOUD_RUN_SERVICE_PROD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          EXPECTED_GITHUB_REPOSITORY: ${{ vars.EXPECTED_GITHUB_REPOSITORY }}
          EXPECTED_GITHUB_OWNER: ${{ vars.EXPECTED_GITHUB_OWNER }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          for key in GCP_PROJECT_ID_PROD CLOUD_RUN_REGION CLOUD_RUN_SERVICE_PROD PROD_BASE_URL GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required deploy config: ${key}"
              exit 1
            fi
          done
          if [ -n "${EXPECTED_GITHUB_REPOSITORY:-}" ] && [ "${EXPECTED_GITHUB_REPOSITORY}" != "${GH_REPOSITORY}" ]; then
            echo "::error::Repo mismatch: expected ${EXPECTED_GITHUB_REPOSITORY}, got ${GH_REPOSITORY}"
            exit 1
          fi
          if [ -n "${EXPECTED_GITHUB_OWNER:-}" ] && [ "${EXPECTED_GITHUB_OWNER}" != "${GH_REPOSITORY_OWNER}" ]; then
            echo "::error::Owner mismatch: expected ${EXPECTED_GITHUB_OWNER}, got ${GH_REPOSITORY_OWNER}"
            exit 1
          fi
          echo "Deploy context: repo=${GH_REPOSITORY} owner=${GH_REPOSITORY_OWNER} target=production-main"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI gate
        run: npm run ci:gate

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_PROD }}

      - name: Drop legacy ALLOW_ANY_X_USER_LOGIN secret binding (if present)
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --remove-secrets=ALLOW_ANY_X_USER_LOGIN \
            --quiet || echo "::notice::No ALLOW_ANY_X_USER_LOGIN secret binding to remove (ok)"

      - name: Verify required Secret Manager secrets exist (production)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID_PROD }}"
          for s in MONGODB_URI_B64 XAI_API_KEY XAI_MANAGEMENT_API_KEY X_OAUTH_CLIENT_ID X_OAUTH_CLIENT_SECRET AUTH_SECRET SLACK_WEBHOOK_URL ADMIN_SEED_EMAIL; do
            errfile="$(mktemp)"
            if gcloud secrets describe "$s" --project="$PROJECT" --format='value(name)' >/dev/null 2>"$errfile"; then
              rm -f "$errfile"
              continue
            fi
            err="$(cat "$errfile")"
            rm -f "$errfile"
            if echo "$err" | grep -qE 'PERMISSION_DENIED|permission.*denied|403'; then
              echo "::error::Secret Manager IAM denied for '${s}' in ${PROJECT} (need secretmanager.secrets.get). Grant the GitHub deploy SA (secret GCP_SERVICE_ACCOUNT_EMAIL) roles/secretmanager.viewer or roles/secretmanager.admin on this project — see DEVELOPMENT.md (GCP Secret Manager)."
            else
              echo "::error::Missing or unreachable GCP secret '${s}' in project ${PROJECT}"
              echo "$err"
            fi
            exit 1
          done

      - name: Clear legacy ADMIN_SEED_EMAIL bindings (literal or old secret ref)
        run: |
          SVC="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
          R="${{ vars.CLOUD_RUN_REGION }}"
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-secrets=ADMIN_SEED_EMAIL --quiet || true
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-env-vars=ADMIN_SEED_EMAIL --quiet || true

      - name: Deploy to Cloud Run (production)
        env:
          ALLOW_ANY_X_USER_LOGIN: ${{ vars.ALLOW_ANY_X_USER_LOGIN || 'false' }}
          ENABLE_XCHAT_DEBUG: ${{ vars.ENABLE_XCHAT_DEBUG || 'false' }}
          XAI_CHAT_MODEL: ${{ vars.XAI_CHAT_MODEL || 'grok-4-1-fast-reasoning' }}
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            --source . \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,X_OAUTH_CALLBACK_URL=${{ vars.PROD_BASE_URL }}/api/auth/x/callback,ALLOW_ANY_X_USER_LOGIN=${ALLOW_ANY_X_USER_LOGIN},ENABLE_XCHAT_DEBUG=${ENABLE_XCHAT_DEBUG},XAI_CHAT_MODEL=${XAI_CHAT_MODEL}" \
            --set-secrets "MONGODB_URI_B64=MONGODB_URI_B64:latest,XAI_API_KEY=XAI_API_KEY:latest,XAI_MANAGEMENT_API_KEY=XAI_MANAGEMENT_API_KEY:latest,X_OAUTH_CLIENT_ID=X_OAUTH_CLIENT_ID:latest,X_OAUTH_CLIENT_SECRET=X_OAUTH_CLIENT_SECRET:latest,AUTH_SECRET=AUTH_SECRET:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,ADMIN_SEED_EMAIL=ADMIN_SEED_EMAIL:latest" \
            --quiet

      - name: Health check production
        run: |
          bash scripts/ops/health-check-with-fallback.sh \
            "production" \
            "${{ vars.PROD_BASE_URL }}" \
            "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            "${{ vars.CLOUD_RUN_REGION }}" \
            "18" \
            "15"

      - name: Post production deploy note to Slack
        env:
          DEPLOYMENT_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_notes || '' }}
          HOTFIX_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_notes || '' }}
        run: |
          set -euo pipefail
          WEBHOOK_URL="$(gcloud secrets versions access latest --secret=SLACK_WEBHOOK_URL --project='${{ vars.GCP_PROJECT_ID_PROD }}' 2>/dev/null || true)"
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL is empty in production Secret Manager; skipping post-deploy Slack note."
            exit 0
          fi
          if [ "${WEBHOOK_URL}" = "__EMPTY__" ]; then
            echo "::notice::SLACK_WEBHOOK_URL placeholder indicates disabled Slack notifications; skipping."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOYMENT_NOTES_VALUE="${DEPLOYMENT_NOTES:-}"
          HOTFIX_NOTES_VALUE="${HOTFIX_NOTES:-}"
          export RUN_URL
          export DEPLOYMENT_NOTES_VALUE
          export HOTFIX_NOTES_VALUE
          export CLOUD_RUN_SERVICE_PROD="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
          export PROD_BASE_URL="${{ vars.PROD_BASE_URL }}"

          PAYLOAD="$(python3 -c 'import json,os; run_url=os.getenv("RUN_URL",""); notes=(os.getenv("DEPLOYMENT_NOTES_VALUE") or "").strip(); hotfix=(os.getenv("HOTFIX_NOTES_VALUE") or "").strip(); actor=os.getenv("GITHUB_ACTOR","unknown"); sha=(os.getenv("GITHUB_SHA","") or "")[:7]; ref_name=os.getenv("GITHUB_REF_NAME",""); service=os.getenv("CLOUD_RUN_SERVICE_PROD",""); base_url=os.getenv("PROD_BASE_URL",""); lines=["✅ Production deploy succeeded", f"• Service: {service}", f"• Ref: {ref_name} @ {sha}", f"• Actor: {actor}", f"• URL: {base_url}", f"• Run: {run_url}"]; lines += [f"• Deployment notes: {notes}"] if notes else []; lines += [f"• Hotfix notes: {hotfix}"] if hotfix else []; print(json.dumps({"text":"\\n".join(lines)}))')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${WEBHOOK_URL}" >/dev/null

  deploy-production-direct:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.approval == 'approve-production'
    name: Deploy Production (Manual Approval Only)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production deploy configuration
        env:
          GCP_PROJECT_ID_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE_PROD: ${{ vars.CLOUD_RUN_SERVICE_PROD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          EXPECTED_GITHUB_REPOSITORY: ${{ vars.EXPECTED_GITHUB_REPOSITORY }}
          EXPECTED_GITHUB_OWNER: ${{ vars.EXPECTED_GITHUB_OWNER }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          for key in GCP_PROJECT_ID_PROD CLOUD_RUN_REGION CLOUD_RUN_SERVICE_PROD PROD_BASE_URL GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required deploy config: ${key}"
              exit 1
            fi
          done
          if [ -n "${EXPECTED_GITHUB_REPOSITORY:-}" ] && [ "${EXPECTED_GITHUB_REPOSITORY}" != "${GH_REPOSITORY}" ]; then
            echo "::error::Repo mismatch: expected ${EXPECTED_GITHUB_REPOSITORY}, got ${GH_REPOSITORY}"
            exit 1
          fi
          if [ -n "${EXPECTED_GITHUB_OWNER:-}" ] && [ "${EXPECTED_GITHUB_OWNER}" != "${GH_REPOSITORY_OWNER}" ]; then
            echo "::error::Owner mismatch: expected ${EXPECTED_GITHUB_OWNER}, got ${GH_REPOSITORY_OWNER}"
            exit 1
          fi
          echo "Deploy context: repo=${GH_REPOSITORY} owner=${GH_REPOSITORY_OWNER} target=production-direct"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI gate
        run: npm run ci:gate

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_PROD }}

      - name: Drop legacy ALLOW_ANY_X_USER_LOGIN secret binding (if present)
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --remove-secrets=ALLOW_ANY_X_USER_LOGIN \
            --quiet || echo "::notice::No ALLOW_ANY_X_USER_LOGIN secret binding to remove (ok)"

      - name: Verify required Secret Manager secrets exist (production)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID_PROD }}"
          for s in MONGODB_URI_B64 XAI_API_KEY XAI_MANAGEMENT_API_KEY X_OAUTH_CLIENT_ID X_OAUTH_CLIENT_SECRET AUTH_SECRET SLACK_WEBHOOK_URL ADMIN_SEED_EMAIL; do
            errfile="$(mktemp)"
            if gcloud secrets describe "$s" --project="$PROJECT" --format='value(name)' >/dev/null 2>"$errfile"; then
              rm -f "$errfile"
              continue
            fi
            err="$(cat "$errfile")"
            rm -f "$errfile"
            if echo "$err" | grep -qE 'PERMISSION_DENIED|permission.*denied|403'; then
              echo "::error::Secret Manager IAM denied for '${s}' in ${PROJECT} (need secretmanager.secrets.get). Grant the GitHub deploy SA (secret GCP_SERVICE_ACCOUNT_EMAIL) roles/secretmanager.viewer or roles/secretmanager.admin on this project — see DEVELOPMENT.md (GCP Secret Manager)."
            else
              echo "::error::Missing or unreachable GCP secret '${s}' in project ${PROJECT}"
              echo "$err"
            fi
            exit 1
          done

      - name: Clear legacy ADMIN_SEED_EMAIL bindings (literal or old secret ref)
        run: |
          SVC="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
          R="${{ vars.CLOUD_RUN_REGION }}"
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-secrets=ADMIN_SEED_EMAIL --quiet || true
          gcloud run services update "$SVC" --region "$R" --platform managed --remove-env-vars=ADMIN_SEED_EMAIL --quiet || true

      - name: Deploy to Cloud Run (production)
        env:
          ALLOW_ANY_X_USER_LOGIN: ${{ vars.ALLOW_ANY_X_USER_LOGIN || 'false' }}
          ENABLE_XCHAT_DEBUG: ${{ vars.ENABLE_XCHAT_DEBUG || 'false' }}
          XAI_CHAT_MODEL: ${{ vars.XAI_CHAT_MODEL || 'grok-4-1-fast-reasoning' }}
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            --source . \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,X_OAUTH_CALLBACK_URL=${{ vars.PROD_BASE_URL }}/api/auth/x/callback,ALLOW_ANY_X_USER_LOGIN=${ALLOW_ANY_X_USER_LOGIN},ENABLE_XCHAT_DEBUG=${ENABLE_XCHAT_DEBUG},XAI_CHAT_MODEL=${XAI_CHAT_MODEL}" \
            --set-secrets "MONGODB_URI_B64=MONGODB_URI_B64:latest,XAI_API_KEY=XAI_API_KEY:latest,XAI_MANAGEMENT_API_KEY=XAI_MANAGEMENT_API_KEY:latest,X_OAUTH_CLIENT_ID=X_OAUTH_CLIENT_ID:latest,X_OAUTH_CLIENT_SECRET=X_OAUTH_CLIENT_SECRET:latest,AUTH_SECRET=AUTH_SECRET:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,ADMIN_SEED_EMAIL=ADMIN_SEED_EMAIL:latest" \
            --quiet

      - name: Health check production
        run: |
          bash scripts/ops/health-check-with-fallback.sh \
            "production" \
            "${{ vars.PROD_BASE_URL }}" \
            "${{ vars.CLOUD_RUN_SERVICE_PROD }}" \
            "${{ vars.CLOUD_RUN_REGION }}" \
            "18" \
            "15"

      - name: Post production deploy note to Slack
        env:
          DEPLOYMENT_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_notes || '' }}
          HOTFIX_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_notes || '' }}
        run: |
          set -euo pipefail
          WEBHOOK_URL="$(gcloud secrets versions access latest --secret=SLACK_WEBHOOK_URL --project='${{ vars.GCP_PROJECT_ID_PROD }}' 2>/dev/null || true)"
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL is empty in production Secret Manager; skipping post-deploy Slack note."
            exit 0
          fi
          if [ "${WEBHOOK_URL}" = "__EMPTY__" ]; then
            echo "::notice::SLACK_WEBHOOK_URL placeholder indicates disabled Slack notifications; skipping."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOYMENT_NOTES_VALUE="${DEPLOYMENT_NOTES:-}"
          HOTFIX_NOTES_VALUE="${HOTFIX_NOTES:-}"
          export RUN_URL
          export DEPLOYMENT_NOTES_VALUE
          export HOTFIX_NOTES_VALUE
          export CLOUD_RUN_SERVICE_PROD="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
          export PROD_BASE_URL="${{ vars.PROD_BASE_URL }}"

          PAYLOAD="$(python3 -c 'import json,os; run_url=os.getenv("RUN_URL",""); notes=(os.getenv("DEPLOYMENT_NOTES_VALUE") or "").strip(); hotfix=(os.getenv("HOTFIX_NOTES_VALUE") or "").strip(); actor=os.getenv("GITHUB_ACTOR","unknown"); sha=(os.getenv("GITHUB_SHA","") or "")[:7]; ref_name=os.getenv("GITHUB_REF_NAME",""); service=os.getenv("CLOUD_RUN_SERVICE_PROD",""); base_url=os.getenv("PROD_BASE_URL",""); lines=["✅ Production deploy succeeded", f"• Service: {service}", f"• Ref: {ref_name} @ {sha}", f"• Actor: {actor}", f"• URL: {base_url}", f"• Run: {run_url}"]; lines += [f"• Deployment notes: {notes}"] if notes else []; lines += [f"• Hotfix notes: {hotfix}"] if hotfix else []; print(json.dumps({"text":"\\n".join(lines)}))')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${WEBHOOK_URL}" >/dev/null
