name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Vitest + JUnit for GitHub)
        id: vitest
        if: success()
        run: |
          mkdir -p test-results
          npx vitest run \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=test-results/vitest-junit.xml

      - name: Publish frontend test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.vitest.outcome != 'skipped'
        with:
          check_name: Frontend (Vitest)
          files: test-results/vitest-junit.xml
          comment_mode: off
          report_individual_runs: true
