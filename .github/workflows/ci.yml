name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint, typecheck, Next cache, build
        uses: ./.github/actions/node-verify
        with:
          node-version: "22"

      - name: Docs links check
        if: success()
        run: npm run docs:links

      - name: Tests (Vitest + JUnit for GitHub)
        id: vitest
        if: success()
        run: |
          mkdir -p test-results
          npx vitest run \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=test-results/vitest-junit.xml

      - name: Publish frontend test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.vitest.outcome != 'skipped'
        with:
          check_name: Frontend (Vitest)
          files: test-results/vitest-junit.xml
          comment_mode: off
          report_individual_runs: true
