name: atxfinance-backend (Kotlin/Spring) — CI

on:
  pull_request:
    paths:
      - "services/atxfinance-backend/**"
      - "Dockerfile"
      - ".github/workflows/backend-java-ci.yml"
  push:
    branches: [feature/**]
    paths:
      - "services/atxfinance-backend/**"
      - "Dockerfile"
      - ".github/workflows/backend-java-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/atxfinance-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            services/atxfinance-backend/*.gradle*
            services/atxfinance-backend/gradle/*.toml
      - name: Gradle test
        run: chmod +x ./gradlew && ./gradlew test --no-daemon
      - name: Archive unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/atxfinance-backend/build/reports/tests/test
            services/atxfinance-backend/build/test-results/test

  container-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          tags: atxfinance/atxfinance-backend:ci
