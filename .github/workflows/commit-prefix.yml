name: Commit message prefix check

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

jobs:
  check-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail
          regex='^junie-aTx⚡dev-agent .+ [0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while read -r sha; do
            msg="$(git log -1 --pretty=%B "$sha" | tr -d '\r')"
            if ! [[ "$msg" =~ $regex ]]; then
              echo "::error title=Bad commit message::$sha: $msg"
              failed=1
            fi
          done < <(git rev-list "$base..$head")
          exit $failed
