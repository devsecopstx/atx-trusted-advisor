name: Rollback Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rollback target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: "Cloud Run revision name to route 100% traffic to"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rollback:
    name: Rollback Cloud Run Revision
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && vars.PROD_BASE_URL || vars.STAGING_BASE_URL }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.revision }}" ]; then
            echo "revision input is required"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.target == 'production' && vars.GCP_PROJECT_ID_PROD || vars.GCP_PROJECT_ID_STAGING }}

      - name: Shift traffic to selected revision
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
            BASE_URL="${{ vars.PROD_BASE_URL }}"
          else
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_STAGING }}"
            BASE_URL="${{ vars.STAGING_BASE_URL }}"
          fi

          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --to-revisions "${{ inputs.revision }}=100" \
            --quiet

          echo "rollback_target=${{ inputs.target }}"
          echo "rollback_service=${SERVICE_NAME}"
          echo "rollback_revision=${{ inputs.revision }}"
          echo "rollback_base_url=${BASE_URL}"

      - name: Verify health after rollback
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            BASE_URL="${{ vars.PROD_BASE_URL }}"
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
            LABEL_PREFIX="production"
          else
            BASE_URL="${{ vars.STAGING_BASE_URL }}"
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_STAGING }}"
            LABEL_PREFIX="staging"
          fi
          bash scripts/ops/health-check-with-fallback.sh \
            "${LABEL_PREFIX}" \
            "${BASE_URL}" \
            "${SERVICE_NAME}" \
            "${{ vars.CLOUD_RUN_REGION }}" \
            "12" \
            "10"
