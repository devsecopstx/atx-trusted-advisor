name: Rollback Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rollback target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: "Cloud Run revision name to route 100% traffic to"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rollback:
    name: Rollback Cloud Run Revision
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && vars.PROD_BASE_URL || vars.STAGING_BASE_URL }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.revision }}" ]; then
            echo "revision input is required"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.target == 'production' && vars.GCP_PROJECT_ID_PROD || vars.GCP_PROJECT_ID_STAGING }}

      - name: Shift traffic to selected revision
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
            BASE_URL="${{ vars.PROD_BASE_URL }}"
          else
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_STAGING }}"
            BASE_URL="${{ vars.STAGING_BASE_URL }}"
          fi

          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --platform managed \
            --to-revisions "${{ inputs.revision }}=100" \
            --quiet

          echo "rollback_target=${{ inputs.target }}"
          echo "rollback_service=${SERVICE_NAME}"
          echo "rollback_revision=${{ inputs.revision }}"
          echo "rollback_base_url=${BASE_URL}"

      - name: Verify health after rollback
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_PROD }}"
            BASE_URL="${{ vars.PROD_BASE_URL }}"
            LABEL_PREFIX="production"
          else
            SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_STAGING }}"
            BASE_URL="${{ vars.STAGING_BASE_URL }}"
            LABEL_PREFIX="staging"
          fi

          health_check_with_retry() {
            local label="$1"
            local url="$2"
            local attempts=12
            local sleep_seconds=10

            for attempt in $(seq 1 "${attempts}"); do
              local response_file
              response_file="$(mktemp)"
              local http_code
              http_code="$(
                curl --silent --show-error --location \
                  --connect-timeout 5 --max-time 15 \
                  --output "${response_file}" --write-out "%{http_code}" \
                  "${url}" || true
              )"
              local response_body
              response_body="$(tr -d '\n' < "${response_file}")"

              if [ "${http_code}" = "200" ] && [[ "${response_body}" == *"\"status\":\"ok\""* ]]; then
                rm -f "${response_file}"
                echo "${label}:ok attempt=${attempt}"
                return 0
              fi

              rm -f "${response_file}"
              echo "${label}:pending attempt=${attempt}/${attempts} status=${http_code:-curl_error}"
              if [ "${attempt}" -lt "${attempts}" ]; then
                sleep "${sleep_seconds}"
              fi
            done

            echo "${label}:failed after ${attempts} attempts"
            return 1
          }

          if health_check_with_retry "${LABEL_PREFIX}_custom_domain_health" "${BASE_URL}/api/health"; then
            echo "${LABEL_PREFIX}_health_check:custom_domain_ok"
          else
            echo "${LABEL_PREFIX}_custom_domain_health:falling back to run.app URL"
            SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" --region "${{ vars.CLOUD_RUN_REGION }}" --format='value(status.url)')"
            health_check_with_retry "${LABEL_PREFIX}_run_app_health" "${SERVICE_URL}/api/health"
          fi
