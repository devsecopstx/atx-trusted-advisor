server:
  port: 8080

spring:
  quartz:
    job-store-type: memory
    wait-for-jobs-to-complete-on-shutdown: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  application:
    name: atxfinance-backend
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  data:
    mongodb:
      # Omit spring.data.mongodb.database here: a default (e.g. atxfinance) overrides the DB name embedded in
      # mongodb+srv://…/your_db and desyncs Spring from Next.js getDb(). DB name comes from MONGODB_URI path,
      # or from the localhost fallback URI below (still honors MONGODB_DB_NAME / SPRING_DATA_MONGODB_DATABASE).
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DB_NAME:atxfinance}}}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    web:
      client:
        # Safety net if a new outbound URL shape bypasses templating (default is often 100).
        max-uri-tags: 200

shedlock:
  defaults:
    lock-at-most-for: PT5M
    lock-at-least-for: PT0S

app:
  atxfinance:
    session-cookie-name: xf_core_session
    portfolios-collection: ${TENANT_PORTFOLIO_COLLECTION:tenant_portfolio}
    accounts-collection: portfolio_accounts
    watchlists-collection: portfolio_watchlists
    positions-collection: portfolio_positions
    app-user-recommendations-collection: app_user_recommendations
    portfolio-recommendations-collection: portfolio_recommendations
    rag-files-collection: ${RAG_FILES_COLLECTION:xai_collections}
    rag-chunks-collection: ${RAG_CHUNKS_COLLECTION:xchat_rag_chunks}
    core-users-collection: ${CORE_USERS_COLLECTION:core_users}
    tenant-portfolio-org-key: ${TENANT_PORTFOLIO_ORG_KEY:org-atx-finance}
    strategy-jobs-collection: ${STRATEGY_JOBS_COLLECTION:strategy_jobs}
    strategy-jobs-ttl-days: ${STRATEGY_JOBS_TTL_DAYS:90}
    strategy-max-jobs-hourly: ${STRATEGY_MAX_JOBS_HOURLY:12}
    strategy-soft-warn-jobs-hourly: ${STRATEGY_SOFT_WARN_JOBS_HOURLY:8}
    strategy-finalizer-model: ${STRATEGY_FINALIZER_MODEL:grok-4.3}
    strategy-finalizer-sync-for-global-admin: ${STRATEGY_FINALIZER_SYNC_FOR_GLOBAL_ADMIN:false}
    strategy-finalizer-multi-agent-for-global-admin: ${STRATEGY_FINALIZER_MULTI_AGENT_FOR_GLOBAL_ADMIN:true}
    strategy-team-kb-collection-id: ${STRATEGY_TEAM_KB_COLLECTION_ID:}
    portfolio-workspace-snapshots-collection: ${PORTFOLIO_WORKSPACE_SNAPSHOTS_COLLECTION:portfolio_workspace_snapshots}
    portfolio-workspace-snapshot-purge-enabled: ${PORTFOLIO_WORKSPACE_SNAPSHOT_PURGE_ENABLED:true}
    portfolio-workspace-snapshot-purge-retention-days: ${PORTFOLIO_WORKSPACE_SNAPSHOT_PURGE_RETENTION_DAYS:14}
    portfolio-workspace-snapshot-purge-interval-ms: ${PORTFOLIO_WORKSPACE_SNAPSHOT_PURGE_INTERVAL_MS:21600000}
    redis:
      url: ${REDIS_URL:}
      tls-plain-with-rediss: ${REDIS_TLS_PLAIN_WITH_REDISS:false}
      pkce-ttl-seconds: ${OAUTH_PKCE_REDIS_TTL_SECONDS:600}
      auth-login-limit-per-minute: ${AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:30}
      auth-callback-limit-per-minute: ${AUTH_RATE_LIMIT_CALLBACK_PER_MINUTE:60}
      oauth-flow-cookie-max-age-seconds: ${OAUTH_FLOW_TTL_SECONDS:1800}
      portfolio-snapshot-ttl-open-seconds: ${PORTFOLIO_SNAPSHOT_TTL_OPEN_SECONDS:60}
      portfolio-snapshot-ttl-closed-seconds: ${PORTFOLIO_SNAPSHOT_TTL_CLOSED_SECONDS:300}
    scheduler:
      enabled: ${ADMIN_SCHEDULER_ENABLED:true}
      driver: ${ADMIN_SCHEDULER_DRIVER:quartz}
      poll-interval-ms: ${ADMIN_SCHEDULER_POLL_INTERVAL_MS:60000}
      max-tasks-per-poll: ${ADMIN_SCHEDULER_MAX_TASKS_PER_POLL:50}
    scheduler-delegate:
      next-base-url: ${ATX_SCHEDULER_NEXT_BASE_URL:}
      internal-secret: ${ATX_SCHEDULER_INTERNAL_SECRET:}
  pubsub:
    project-id: ${PUBSUB_PROJECT_ID:}
    topic: ${PUBSUB_TOPIC:atxfinance-backend-requests}
    dlq-topic: ${PUBSUB_DLQ_TOPIC:atxfinance-backend-requests-dlq}
