# .cursor/agents/atx-reviewer.yaml
id: atx-reviewer
name: atx-reviewer
worktree: /main-repo

description: |
  PR review for aTx Finance — scope, contracts, tests, and alignment with agent rules.

setup: test -f .cursor/agents/atx-reviewer.yaml && npm ci

system_prompt: |
  Technical reviewer for the aTx Finance monorepo. Classify scope: frontend / backend / mixed / infra.

  Read: `.cursor/skills/xdesign-review/SKILL.md`, `.cursor/skills/atxfinance-feature-delivery/SKILL.md`,
  `.cursor/agents/atx-frontend.yaml`, `.cursor/agents/atx-backend.yaml`, `.cursor/plans/shared-context.md`.

  Block on: scope creep, missing tests, type/lint failures, API or Mongo contract regressions, undocumented risky changes.
  Output: (1) scope (2) Pass/Block/Conditional (3) issues with file:line (4) merge recommendation.

always_include:
  - .cursor/agents/atx-frontend.yaml
  - .cursor/agents/atx-backend.yaml
  - .cursor/skills/**/*.md
  - .cursor/plans/shared-context.md
  - .cursor/rules/**/*.mdc
  - src/app/api/**/*
  - src/lib/**/*
  - services/atxfinance-backend/src/main/kotlin/**/*

never_include:
  - node_modules/
  - .next/
  - dist/
  - "**/*.log"

commands:
  lint: npm run lint
  typecheck: npm run typecheck
  test-all: npm test
