<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>atxFinance Premium Hero</title>
    <link rel="stylesheet" href="./atxfinance-brand-kit.css" />
  </head>
  <body>
    <section class="xf-hero-4x5 xf-noise-overlay">
      <div class="xf-hero-content">
        <header class="xf-logo-lockup">
          <h1 class="xf-logo-title"><span class="xf-logo-x">X</span>Finance</h1>
          <p class="xf-logo-subtitle">Powered by xAI</p>
        </header>

        <aside class="xf-card-stack">
          <article class="xf-floating-card xf-glass">
            <h2 class="xf-card-title">Grok</h2>
            <p class="xf-card-label">AI Assistant</p>
            <div style="margin-top: 14px">
              <span class="xf-chip xf-chip-blue">Predictive Insights</span>
            </div>
            <svg class="xf-node-links" viewBox="0 0 120 72" aria-hidden="true">
              <line x1="12" y1="15" x2="56" y2="34"></line>
              <line x1="56" y1="34" x2="98" y2="18"></line>
              <line x1="56" y1="34" x2="93" y2="56"></line>
              <circle cx="12" cy="15" r="3"></circle>
              <circle cx="56" cy="34" r="3"></circle>
              <circle cx="98" cy="18" r="3"></circle>
              <circle cx="93" cy="56" r="3"></circle>
            </svg>
          </article>

          <article class="xf-floating-card xf-glass">
            <h2 class="xf-card-title">xMoney</h2>
            <p class="xf-card-label">Payments and Transfers</p>
            <div style="display: flex; gap: 12px; margin-top: 16px">
              <span class="xf-token-glyph">₿</span>
              <span class="xf-token-glyph">Ξ</span>
              <span class="xf-token-glyph">X</span>
            </div>
          </article>
        </aside>

        <figure class="xf-phone-shell" aria-label="atxFinance app mockup">
          <div class="xf-phone-screen">
            <div class="xf-widget" style="padding: 14px; margin-bottom: 10px">
              <strong style="display: block; margin-bottom: 8px">Portfolio</strong>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  color: var(--xf-text-300);
                  font-size: 13px;
                "
              >
                <span>Total Balance</span>
                <span>$124,508.22</span>
              </div>
            </div>
            <div class="xf-widget" style="padding: 12px 14px; margin-bottom: 10px">
              <strong style="display: block; margin-bottom: 10px">Crypto Trends</strong>
              <div class="xf-chart-bars">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="xf-widget" style="padding: 12px 14px; margin-bottom: 10px">
              <strong style="display: block; margin-bottom: 10px">Grok Assistant</strong>
              <span class="xf-chip xf-chip-purple">Rebalance Suggestion</span>
            </div>
            <div class="xf-widget" style="padding: 12px 14px">
              <strong style="display: block; margin-bottom: 8px">xMoney Activity</strong>
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  color: var(--xf-text-300);
                  font-size: 13px;
                "
              >
                <span>Transfer to Savings +$2,400</span>
                <span>Crypto Buy BTC -$740</span>
                <span>Card Settlement +$1,150</span>
              </div>
            </div>
          </div>
        </figure>
      </div>
    </section>
  </body>
</html>
