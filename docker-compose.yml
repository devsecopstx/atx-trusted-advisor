services:
  mongodb:
    image: mongo:8
    container_name: atxfinance-mongodb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # If something else (e.g. Homebrew mongod) already uses host 27017, use "27018:27017" and point MONGODB_URI at :27018.
      - "27017:27017"
    environment:
      # One app DB per deployment; default base matches src/lib/env.ts (optional ATX_DEPLOY_TARGET suffix is app-level, not compose)
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-atxfinance}
      # Local root user: MONGO_ROOT_USERNAME for parity with resolve-mongo-uri / getMongoUri. Default admin.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      # Non-empty password required for Mongo to create the root SCRAM user on first data dir init.
      # If Compose sees an empty MONGO_ROOT_PASSWORD (unset, empty shell, or `MONGO_ROOT_PASSWORD=` in .env),
      # `${...:-}` would skip creation — `mongosh -u admin -p …` then always fails. Default `localdev` for local Docker.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-localdev}
    volumes:
      - atxfinance_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  atxfinance-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atxfinance-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # `.env` often sets MONGODB_URI=localhost for Next.js on the host. Inside this container
      # localhost is wrong — MongoUriEnvPostProcessor would override the URI below. Clear it so
      # Spring uses SPRING_DATA_MONGODB_URI (hostname `mongodb`, Docker network).
      MONGODB_URI: ""
      # If you need a custom DB name, set MONGODB_DB_NAME in .env (must match Mongo init / Next.js).
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-localdev}@mongodb:27017/${MONGODB_DB_NAME:-atxfinance}?authSource=admin"
    ports:
      - "8080:8080"

volumes:
  atxfinance_mongo_data:
