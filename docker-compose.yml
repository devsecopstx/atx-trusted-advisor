services:
  mongodb:
    image: mongo:8
    container_name: atxfinance-mongodb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "27017:27017"
    environment:
      # One app DB per deployment; default matches src/lib/env.ts MONGODB_DB_NAME
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-atxfinancedb}
      # Local root user should be deterministic (`admin`) unless explicitly overridden.
      # ADMIN_X_USERNAMES is an app allowlist and must not change Mongo root auth.
      MONGO_INITDB_ROOT_USERNAME: ${ADMIN_X_USERNAME:-admin}
      # Use provided password or fallback to the requested default
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-atxrocks!}
    volumes:
      - atxfinance_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  atxfinance-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atxfinance-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # If MONGODB_URI is set (plain or base64), Spring MongoUriEnvPostProcessor resolves it.
      # Otherwise, use local Mongo with credentials and db name.
      SPRING_DATA_MONGODB_URI: "mongodb://${ADMIN_X_USERNAME:-${ADMIN_X_USERNAMES:-admin}}:${MONGO_ROOT_PASSWORD:-atxrocks!}@mongodb:27017/${MONGODB_DB_NAME:-atxfinancedb}?authSource=admin"
    ports:
      - "8080:8080"

volumes:
  atxfinance_mongo_data:
